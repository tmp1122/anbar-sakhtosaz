<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دفتر انبار | ساخت‌وساز</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#f4efe2; --paper2:#eae2cd; --card:#fffdf8; --rule:#d9cfb4;
  --ink:#2b2419; --ink-muted:#7a6f5c;
  --navy:#1f4e79; --navy-dim:#e4edf5;
  --green:#2f6b3f; --green-dim:#e5efe3;
  --red:#a5372a; --red-dim:#f6e4e0;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
body{font-family:'Vazirmatn',sans-serif;min-height:100vh;font-size:15px;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;}
input,select,textarea,button{font-family:inherit;}

.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;}
.topbar .ttl{font-size:18px;font-weight:800;}
.topbar .sub{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
.burger{background:var(--card);border:2px solid var(--ink);width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
.burger svg{width:19px;height:19px;}
.content{padding:16px 16px 60px;max-width:640px;margin:0 auto;}
.empty{color:var(--ink-muted);text-align:center;padding:40px 16px;font-size:13.5px;}

.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 var(--rule);}
.stamp-card{border:2px dashed var(--navy);}
.section-title{font-size:13px;font-weight:800;color:var(--ink-muted);margin:20px 2px 10px;text-transform:uppercase;letter-spacing:.3px;}

.btn{background:var(--navy);color:#fff;border:none;padding:14px 16px;border-radius:12px;font-weight:700;font-size:14.5px;width:100%;}
.btn:disabled{opacity:.5;}
.btn-outline{background:var(--card);color:var(--navy);border:2px solid var(--navy);}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-flat{background:none;border:none;color:var(--navy);font-weight:700;font-size:13px;padding:6px 2px;}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;color:var(--ink-muted);margin-bottom:6px;font-weight:600;}
.req::after{content:" *";color:var(--red);}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=date],select,textarea{
  width:100%;background:var(--card);border:1.5px solid var(--rule);color:var(--ink);
  padding:12px 13px;border-radius:11px;font-size:14.5px;}
input:focus,select:focus{outline:none;border-color:var(--navy);}
input[type=file]{width:100%;color:var(--ink-muted);font-size:12px;}
.error-box{background:var(--red-dim);border:1.5px solid var(--red);color:var(--red);padding:11px 14px;border-radius:11px;margin-bottom:14px;font-size:13px;font-weight:600;}
.file-ok{font-size:11.5px;color:var(--green);margin-top:5px;font-weight:600;}
.hint{background:var(--navy-dim);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--navy);margin-bottom:14px;}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 6px;text-align:center;}
.stat .n{font-size:20px;font-weight:800;}
.stat .l{font-size:10px;color:var(--ink-muted);margin-top:3px;}

/* ledger */
.ledger-row{display:flex;gap:11px;padding:12px 0;border-bottom:1px dashed var(--rule);}
.ledger-row:last-child{border-bottom:none;}
.stamp{width:34px;height:34px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;}
.stamp.in{background:var(--green-dim);color:var(--green);}
.stamp.out{background:var(--red-dim);color:var(--red);}
.ledger-main{flex:1;min-width:0;}
.ledger-top{display:flex;justify-content:space-between;gap:8px;}
.ledger-name{font-weight:700;font-size:14px;}
.ledger-qty{font-size:13.5px;font-weight:800;}
.ledger-qty.in{color:var(--green);} .ledger-qty.out{color:var(--red);}
.ledger-meta{font-size:11.5px;color:var(--ink-muted);margin-top:3px;}

/* item row */
.item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px dashed var(--rule);}
.item-row:last-child{border-bottom:none;}
.item-name{font-weight:700;font-size:14.5px;}
.item-sub{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
.item-stock{text-align:left;flex-shrink:0;}
.item-stock .n{font-size:16px;font-weight:800;}
.item-stock .u{font-size:10.5px;color:var(--ink-muted);}
.low{color:var(--red) !important;}

/* tree */
.tree-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:15px 16px;margin-bottom:9px;}
.tree-item.selectable:active{border-color:var(--navy);}
.tree-item .t{font-weight:700;font-size:14.5px;}
.tree-item .arrow{color:var(--ink-muted);}
.crumbs{font-size:12px;color:var(--navy);font-weight:700;margin-bottom:14px;}
.step-dots{display:flex;gap:6px;margin-bottom:16px;}
.step-dots span{flex:1;height:4px;border-radius:3px;background:var(--rule);}
.step-dots span.on{background:var(--navy);}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;}
.badge-admin{background:#e6dcf5;color:#5a3a8f;} .badge-user{background:var(--paper2);color:var(--ink-muted);}

.search-wrap{position:relative;margin-bottom:12px;}
.dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1.5px solid var(--rule);border-radius:11px;max-height:220px;overflow:auto;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.15);}
.dropdown div{padding:11px 13px;font-size:13.5px;border-bottom:1px solid var(--rule);}
.dropdown div:last-child{border-bottom:none;}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(20,15,5,.5);z-index:60;}
.drawer{position:absolute;top:0;right:0;bottom:0;width:78%;max-width:300px;background:var(--paper);border-left:2px solid var(--ink);padding:20px 16px calc(20px + var(--safe-b));overflow:auto;}
.drawer h2{font-size:16px;margin:4px 0 18px;}
.drawer-link{display:flex;align-items:center;gap:12px;padding:13px 4px;font-size:14.5px;font-weight:700;border-bottom:1px dashed var(--rule);}
.drawer-link svg{width:18px;height:18px;color:var(--navy);flex-shrink:0;}

.fab-wrap{position:fixed;left:18px;bottom:calc(18px + var(--safe-b));z-index:25;display:flex;flex-direction:column;gap:10px;}
.fab{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.25);border:none;color:#fff;font-size:24px;}
.fab.green{background:var(--green);} .fab.red{background:var(--red);}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal{background:var(--paper);border:2px solid var(--ink);border-radius:18px 18px 0 0;padding:20px 18px calc(20px + var(--safe-b));width:100%;max-width:640px;max-height:90vh;overflow:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{font-size:16px;margin:0;font-weight:800;}
.close-x{background:var(--card);border:1.5px solid var(--ink);color:var(--ink);width:30px;height:30px;border-radius:9px;font-size:17px;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--paper);}
.login-box{width:100%;max-width:360px;}
.login-mark{width:56px;height:56px;background:var(--navy);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;color:#fff;}
.login-title{text-align:center;font-size:19px;font-weight:800;margin-bottom:4px;}
.login-sub{text-align:center;font-size:12.5px;color:var(--ink-muted);margin-bottom:24px;}
</style>
</head>

<div id="app"></div>
<script type="module">

const UNITS = ["عدد","کیلوگرم","تن","متر","متر مربع","متر مکعب","شاخه","لیتر","کیسه","پاکت","رول","بسته"];

function icon(n){ return h("span",{html:ICONS[n]||""}); }

function h(tag, props, children){
  var el = document.createElement(tag); props = props||{};
  for(var k in props){
    if(k==="className") el.className = props[k];
    else if(k==="html") el.innerHTML = props[k];
    else if(k==="style") Object.assign(el.style, props[k]);
    else if(k.indexOf("on")===0) el[k.toLowerCase()] = props[k];
    else if(k==="value") el.value = props[k];
    else if(k==="selected"){ if(props[k]) el.setAttribute("selected","selected"); }

  }

}
function toLatinDigits(str){
  if(str==null) return "";
  var fa="۰۱۲۳۴۵۶۷۸۹", ar="٠١٢٣٤٥٦٧٨٩";
  return String(str).replace(/[۰-۹]/g,function(d){return fa.indexOf(d);}).replace(/[٠-٩]/g,function(d){return ar.indexOf(d);});
}
function normalizeFa(s){ return (s||"").toString().replace(/\u064A/g,"ی").replace(/\u0643/g,"ک").replace(/[\u200c\u200f\u200e]/g,"").trim(); }
function can(perm){ if(!state.currentUser) return false; var r=PERMISSIONS[perm]; return r?r.indexOf(state.currentUser.role)!==-1:false; }
function nowLocal(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function toFaDigits(n){ var fa=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"]; return String(n).replace(/\d/g,function(d){return fa[d];}); }
var JALALI_MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function gregorianToJalali(gy, gm, gd){
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979; gy-=(gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+parseInt((gy2+3)/4)-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*parseInt(days/12053); days%=12053;
  jy+=4*parseInt(days/1461); days%=1461;
  if(days>365){ jy+=parseInt((days-1)/365); days=(days-1)%365; }
  var jm,jd;
  if(days<186){ jm=1+parseInt(days/31); jd=1+(days%31); }
  else { jm=7+parseInt((days-186)/30); jd=1+((days-186)%30); }
  return [jy,jm,jd];
}
function jalaliDateStr(d){
  var j=gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  return toFaDigits(j[0])+"/"+toFaDigits(String(j[1]).padStart(2,"0"))+"/"+toFaDigits(String(j[2]).padStart(2,"0"));
}
function jalaliDateStrLong(d){
  var j=gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  return toFaDigits(j[2])+" "+JALALI_MONTHS[j[1]-1]+" "+toFaDigits(j[0]);
}
function jalaliTimeStr(d){
  return toFaDigits(String(d.getHours()).padStart(2,"0"))+":"+toFaDigits(String(d.getMinutes()).padStart(2,"0"));
}
function fmtDT(s){ if(!s) return "-"; var d=new Date(s); return jalaliDateStr(d)+" - "+jalaliTimeStr(d); }
function fmtDTLong(s){ if(!s) return "-"; var d=new Date(s); return jalaliDateStrLong(d)+" - ساعت "+jalaliTimeStr(d); }
function jalaliPreviewFromLocalInput(val, hasTime){
  if(!val) return "";
  var parts = val.split("T"); var dp = parts[0].split("-");
  if(dp.length<3) return "";
  var d = new Date(Number(dp[0]), Number(dp[1])-1, Number(dp[2]));
  var out = "📅 "+jalaliDateStrLong(d);
  if(hasTime && parts[1]) out += " - ساعت "+toFaDigits(parts[1].slice(0,5));
  return out;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function jalaliToGregorian(jy, jm, jd){
  jy += 1595;
  var days = -355668 + (365*jy) + (parseInt(jy/33)*8) + parseInt(((jy%33)+3)/4) + jd + ((jm<7)?(jm-1)*31:(((jm-7)*30)+186));
  var gy = 400*parseInt(days/146097); days %= 146097;
  if(days>36524){ gy += 100*parseInt((days-1)/36524); days=(days-1)%36524; if(days>=365) days++; }
  gy += 4*parseInt(days/1461); days %= 1461;
  if(days>365){ gy += parseInt((days-1)/365); days=(days-1)%365; }
  var gd = days+1;
  var isLeap = (gy%4===0 && gy%100!==0) || (gy%400===0);
  var sal_a=[0,31,isLeap?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm=0;
  for(gm=1; gm<=12; gm++){ if(gd<=sal_a[gm]) break; gd-=sal_a[gm]; }
  return [gy, gm, gd];

function parseLocalDateValue(val){
  var parts = val.split("T"); var dp=parts[0].split("-");
  var d = new Date(Number(dp[0]), Number(dp[1])-1, Number(dp[2]));

var jpState = null;
function openJalaliPicker(currentLocalVal, hasTime, onConfirm){
  var base = currentLocalVal ? parseLocalDateValue(currentLocalVal) : new Date();
  var j = gregorianToJalali(base.getFullYear(), base.getMonth()+1, base.getDate());
  jpState = { y:j[0], m:j[1], d:j[2], h:base.getHours(), mi:base.getMinutes(), hasTime:hasTime, onConfirm:onConfirm };
  render();
}
function jalaliDayCount(jm){ return jm<=6?31:30; }
function buildJalaliPickerModal(){
  if(!jpState) return null;
  var bg=h("div",{className:"modal-bg",onclick:function(e){if(e.target===bg){jpState=null;render();}}});
  var m=h("div",{className:"modal"});
  m.appendChild(h("div",{className:"modal-head"},[h("h3",{},["انتخاب "+(jpState.hasTime?"تاریخ و ساعت":"تاریخ")]),h("button",{className:"close-x",onclick:function(){jpState=null;render();}},["×"])]));
  var row=h("div",{className:"row-2"});

  var ySel=h("select",{onchange:function(e){jpState.y=Number(e.target.value); render();}});
  var curY=jpState.y;
  for(var yy=curY-8; yy<=curY+8; yy++) ySel.appendChild(h("option",{value:yy,selected:yy===curY},[toFaDigits(yy)]));
  yField.appendChild(ySel); m.appendChild(yField);
  if(jpState.hasTime){

    for(var hh=0; hh<24; hh++) hSel.appendChild(h("option",{value:hh,selected:jpState.h===hh},[toFaDigits(String(hh).padStart(2,"0"))]));
    var hField=h("div",{className:"field"}); hField.appendChild(h("label",{},["ساعت"])); hField.appendChild(hSel); tRow.appendChild(hField);
    var miSel=h("select",{onchange:function(e){jpState.mi=Number(e.target.value); render();}});
    for(var mm=0; mm<60; mm+=5) miSel.appendChild(h("option",{value:mm,selected:Math.abs(jpState.mi-mm)<5},[toFaDigits(String(mm).padStart(2,"0"))]));

    m.appendChild(tRow);
  }
  m.appendChild(h("button",{className:"btn",onclick:function(){
    var g=jalaliToGregorian(jpState.y, jpState.m, jpState.d);

    if(jpState.hasTime) val += "T"+String(jpState.h).padStart(2,"0")+":"+String(jpState.mi).padStart(2,"0");
    var cb=jpState.onConfirm; jpState=null; cb(val); render();
  }},["تأیید"]));
  bg.appendChild(m); return bg;
}
function jalaliPickerField(labelText, required, currentVal, hasTime, onConfirm){
  var field=h("div",{className:"field"});
  field.appendChild(h("label",{className:required?"req":""},[labelText]));

var state = {
  page:"dashboard", currentUser:null, loading:false, error:"", drawerOpen:false,
  categories:[], items:[], transactions:[], users:[],
  loginForm:{code:"",password:""},
};
function roots(){ return state.categories.filter(function(c){return !c.parent_id;}); }
function childrenOf(id){ return state.categories.filter(function(c){return c.parent_id===id;}); }
function catPath(id){
  var c = state.categories.find(function(x){return x.id===id;});
  if(!c) return "-";
  var p = state.categories.find(function(x){return x.id===c.parent_id;});
  return p ? p.name+" ← "+c.name : c.name;
}
function itemsIn(catId){ return state.items.filter(function(i){return i.category_id===catId;}); }
function codeBadge(code){ return code ? h("span",{className:"num",style:{marginLeft:"6px"}},[code]) : null; }
function pad(n,len){ return String(n).padStart(len,"0"); }
function generateItemCode(catId){
  var sub = state.categories.find(function(c){return c.id===catId;});
  if(!sub) return null;
  var rootId = sub.parent_id;
  var rs = roots().slice().sort(function(a,b){ return new Date(a.created_at)-new Date(b.created_at); });
  var rIdx = rs.findIndex(function(r){return r.id===rootId;}) + 1;
  var subs = childrenOf(rootId).slice().sort(function(a,b){ return new Date(a.created_at)-new Date(b.created_at); });
  var sIdx = subs.findIndex(function(s){return s.id===catId;}) + 1;
  var seq = itemsIn(catId).length + 1;
  return pad(rIdx,2)+pad(sIdx,2)+pad(seq,3);
}

async function uploadFile(file, folder){
  if(!file) return null;
  var path = folder+"/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9.\-_]/g,"_");
  var res = await sb.storage.from("attachments").upload(path, file);
  if(res.error) throw res.error;
  return sb.storage.from("attachments").getPublicUrl(path).data.publicUrl;
}

function escHtml(s){ return String(s==null?"-":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
async function submitWizard(){
  var f = wz.form;
  if(!f.quantity || Number(f.quantity)<=0){ state.error="مقدار را وارد کنید"; render(); return; }
  if(wz.type==="out" && !wz.item._new && Number(f.quantity) > Number(wz.item.current_stock)){
    state.error="موجودی کافی نیست (موجودی فعلی: "+wz.item.current_stock+" "+wz.item.unit+")"; render(); return;
  }
  state.loading=true; state.error=""; render();
  try{
    var itemId = wz.item.id;
    if(wz.item._new){
      var insRes = await sb.from("items").insert({name:wz.item.name, unit:f.unit, category_id:wz.item.category_id, current_stock:0, code:generateItemCode(wz.item.category_id)}).select();
      if(insRes.error) throw insRes.error;
      itemId = insRes.data[0].id;
      wz.item.id = itemId; wz.item.current_stock = 0; wz.item._new=false;
    }
    var curStock = Number(wz.item.current_stock);
    var newStock = wz.type==="in" ? curStock + Number(f.quantity) : curStock - Number(f.quantity);

    var payload = { type:wz.type, item_id:itemId, quantity:Number(f.quantity), unit:f.unit,
      tx_datetime: new Date(f.tx_datetime).toISOString(), user_id: state.currentUser.id, remaining_stock:newStock };
    if(wz.type==="in"){
      payload.seller_name=f.seller_name||null; payload.driver_name=f.driver_name||null; payload.car_number=f.car_number||null;
      payload.waybill_file_url = await uploadFile(f.waybill_file,"waybills");
      payload.invoice_file_url = await uploadFile(f.invoice_file,"invoices");
    } else {
      payload.requester_name=f.requester_name||null; payload.usage_location=f.usage_location||null;
      payload.signature_file_url = await uploadFile(f.signature_file,"signatures");
    }
    var res = await sb.from("transactions").insert(payload);
    if(res.error) throw res.error;
    var res2 = await sb.from("items").update({current_stock:newStock}).eq("id",itemId);
    if(res2.error) throw res2.error;
    state.loading=false; wz=null; state.page="dashboard"; loadAll(); render();
  }catch(err){
    state.loading=false; state.error="خطا در ثبت: "+(err.message||"دوباره تلاش کنید"); render();
  }
}

    card.appendChild(row);
  });
  content.appendChild(card); wrap.appendChild(content); return wrap;
}
function deleteUser(u){
  if(!confirm("کاربر «"+u.name+"» حذف شود؟")) return;
  sb.from("users").delete().eq("id",u.id).then(function(res){ if(res.error){alert("خطا در حذف");return;} loadUsers(); });
}
var showUserModal=false, editingUser=null, userForm=null;
function openUserModal(u){
  editingUser=u||null; userForm = u?{name:u.name,code:u.code,role:u.role,password:""}:{name:"",code:"",role:"user",password:""};
  showUserModal=true; state.error=""; render();
}
function buildUserModal(){
  if(!showUserModal) return null;
  var f=userForm;
  var bg=h("div",{className:"modal-bg",onclick:function(e){if(e.target===bg){showUserModal=false;render();}}});
  var m=h("div",{className:"modal"});
  m.appendChild(h("div",{className:"modal-head"},[h("h3",{},[editingUser?"ویرایش کاربر":"کاربر جدید"]),h("button",{className:"close-x",onclick:function(){showUserModal=false;render();}},["×"])]));
  if(state.error) m.appendChild(h("div",{className:"error-box"},[state.error]));
  var f1=h("div",{className:"field"}); f1.appendChild(h("label",{},["نام"]));
  f1.appendChild(h("input",{type:"text",value:f.name,oninput:function(e){f.name=e.target.value;}})); m.appendChild(f1);
  var f2=h("div",{className:"field"}); f2.appendChild(h("label",{},["کد کاربری"]));
  f2.appendChild(h("input",{type:"text",value:f.code,oninput:function(e){f.code=e.target.value;}})); m.appendChild(f2);
  var f3=h("div",{className:"field"}); f3.appendChild(h("label",{},[editingUser?"رمز جدید (خالی = بدون تغییر)":"رمز عبور"]));
  f3.appendChild(h("input",{type:"password",value:f.password,oninput:function(e){f.password=e.target.value;}})); m.appendChild(f3);
  var f4=h("div",{className:"field"}); f4.appendChild(h("label",{},["نقش"]));
  var sel=h("select",{onchange:function(e){f.role=e.target.value;}});
  sel.appendChild(h("option",{value:"user",selected:f.role==="user"},["کاربر عادی"]));
  sel.appendChild(h("option",{value:"admin",selected:f.role==="admin"},["مدیر"]));
  f4.appendChild(sel); m.appendChild(f4);
  m.appendChild(h("button",{className:"btn",onclick:function(){
    if(!f.name||!f.code){state.error="نام و کد را وارد کنید";render();return;}
    if(!editingUser && !f.password){state.error="رمز عبور را وارد کنید";render();return;}
    var code=toLatinDigits(f.code.trim());
    if(editingUser){
      sb.from("users").update({name:f.name,code:code,role:f.role}).eq("id",editingUser.id).then(function(res){
        if(res.error){state.error="خطا: "+res.error.message;render();return;}
        var after=function(){showUserModal=false;loadUsers();};
        if(f.password){ sb.rpc("update_user_password",{p_id:editingUser.id,p_new_password:toLatinDigits(f.password)}).then(after); } else after();
      });
    } else {
      sb.rpc("create_user",{p_name:f.name,p_code:code,p_password:toLatinDigits(f.password),p_role:f.role}).then(function(res){
        if(res.error){state.error="خطا: "+res.error.message;render();return;} showUserModal=false; loadUsers();
      });
    }
  }},["ذخیره"]));
  bg.appendChild(m); return bg;
}

/* ============================================================ رندر ============================================================ */
function render(){
  var active = document.activeElement;
  var focusId = (active && active.id) ? active.id : null;
  var selStart = focusId && "selectionStart" in active ? active.selectionStart : null;
  var selEnd = focusId && "selectionEnd" in active ? active.selectionEnd : null;

  var app=document.getElementById("app"); app.innerHTML="";
  if(!state.currentUser){ app.appendChild(pageLogin()); restoreFocus(focusId,selStart,selEnd); return; }
  var content;
  if(state.page==="dashboard") content=pageDashboard();
  else if(state.page==="inventory") content=pageInventory();
  else if(state.page==="wizard") content=pageWizard();
  else if(state.page==="history") content=pageHistory();
  else if(state.page==="categories") content=pageCategories();
  else if(state.page==="users") content=pageUsers();
  else content=pageDashboard();
  app.appendChild(content);
  var im=buildItemModal(); if(im) app.appendChild(im);
  var cm=buildCategoryModal(); if(cm) app.appendChild(cm);
  var um=buildUserModal(); if(um) app.appendChild(um);
  var jm=buildJalaliPickerModal(); if(jm) app.appendChild(jm);
  var dr=drawer(); if(dr) app.appendChild(dr);
  restoreFocus(focusId,selStart,selEnd);
}
function restoreFocus(focusId,selStart,selEnd){
  if(!focusId) return;
  var el=document.getElementById(focusId);
  if(!el) return;
  el.focus();
  if(selStart!=null && "setSelectionRange" in el){
    try{ el.setSelectionRange(selStart,selEnd); }catch(e){}
  }
}
(function init(){
  var sess=loadSession();
  if(sess){ state.currentUser=sess; state.page="dashboard"; loadAll(); if(can("users.manage")) loadUsers(); }
  render();
})();
</script>
