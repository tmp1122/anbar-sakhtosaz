<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعاونی مسکن پالایشگاه گاز ولیعصر (عج)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap">
<style>
:root{
  --font-family:'Vazirmatn','Tahoma',sans-serif;
  --font-body:var(--font-family);
  --font-hero:var(--font-body);
  --font-heading:var(--font-body);
  --primary:#2d7a3a;
  --primary-dark:#1a5c26;
  --primary-light:#4caf64;
  --hero-highlight:#7dd99a;
  --page-bg:#f0f7f1;
  --alt-bg:#e8f4ea;
  --text-color:#0d2010;
  --hero-title-size:60px;
  --hero-desc-size:15px;
  --section-title-size:30px;
  --body-text-size:13px;
  --font-hero-weight:900;
  --font-hero-desc-weight:600;
  --font-heading-weight:900;
  --font-body-weight:400;
  --font-hero-style:normal;
  --font-heading-style:normal;
  --font-body-style:normal;
}

/* فونت‌های محلی — فایل‌ها باید توی پوشه‌ی fonts/ کنار index.html باشن */
@font-face{font-family:'BNazanin';src:url('fonts/BNazanin.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'BNazanin';src:url('fonts/BNazanin-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'BZar';src:url('fonts/BZar-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'BZar';src:url('fonts/BZar-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'BTitr';src:url('fonts/BTitr-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'BShiraz';src:url('fonts/BShiraz.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'BTraffic';src:url('fonts/BTraffic-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'BTraffic';src:url('fonts/BTraffic-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'HussainiNastaleeq';src:url('fonts/HussainiNastaleeq.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'IranNastaliq';src:url('fonts/IranNastaliq2.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);direction:rtl;background:var(--page-bg);color:var(--text-color);min-height:100vh;font-weight:var(--font-body-weight);font-style:var(--font-body-style)}
nav{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(232,244,234,.97);backdrop-filter:blur(14px);border-bottom:1px solid #c8e0cb;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;flex-shrink:0}
.logo-text{font-size:14px;font-weight:800;color:var(--text-color);line-height:1.3}
.nav-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav-link{cursor:pointer;color:var(--primary);font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid transparent;transition:all .25s}
.nav-link:hover{border-color:#2d7a3a33;background:#2d7a3a11}
.btn{padding:9px 18px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .3s;border:none}
.btn-g{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 8px 20px #2d7a3a44}
.btn-o{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-o:hover{background:var(--primary);color:#fff}
/* HERO */

.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:100px 40px 60px;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}.hero-content{position:relative;z-index:10;max-width:640px}
.hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1.5s ease;opacity:0}
.hero-slide.on{opacity:1}






.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-dots{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.hero-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.4);border:2px solid rgba(255,255,255,0.7);cursor:pointer;transition:all .3s}
.hero-dot.on{background:var(--primary-light);border-color:var(--primary-light);width:26px;border-radius:5px}
.hero-label{position:absolute;bottom:50px;right:40px;z-index:2;text-align:right}
.hero-label h4{font-size:14px;color:#fff;font-weight:700}
.hero-label p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:2px}


.tag{font-size:11px;letter-spacing:4px;color:#a0d4a8;font-weight:700;margin-bottom:10px;display:block;text-shadow:0 2px 6px rgba(0,0,0,0.8)}
.hero h1{font-family:var(--font-hero);font-size:clamp(32px,5vw,var(--hero-title-size));font-weight:var(--font-hero-weight);font-style:var(--font-hero-style);line-height:1.25;margin-bottom:18px;color:#ffffff;text-shadow:0 3px 12px rgba(0,0,0,0.8)}
.hero h1 span.green{color:var(--hero-highlight);-webkit-text-fill-color:var(--hero-highlight);background:none;text-shadow:0 3px 12px rgba(0,0,0,0.8)}
.hero p{font-family:var(--font-hero);color:#ffffff;line-height:1.9;font-size:var(--hero-desc-size);margin-bottom:32px;max-width:480px;font-weight:var(--font-hero-desc-weight);font-style:var(--font-hero-style);text-shadow:0 2px 8px rgba(0,0,0,0.9)}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:absolute;bottom:40px;left:40px}
.stat{background:#fff;border:1px solid #c8e0cb;border-radius:12px;padding:16px 20px;text-align:center}
.stat-n{font-size:28px;font-weight:900;color:var(--primary);line-height:1}
.stat-l{color:#5a7a5e;font-size:12px;margin-top:4px}
/* CAROUSEL */
.carousel-section{padding:60px 20px;background:var(--alt-bg);text-align:center}
.section-tag{font-size:11px;letter-spacing:4px;color:var(--primary);font-weight:700;margin-bottom:8px;display:block}
.divider{width:50px;height:3px;background:linear-gradient(90deg,var(--primary),transparent);margin:10px auto 16px;border-radius:2px}
.carousel-section h2{font-size:26px;font-weight:900;color:var(--text-color);margin-bottom:6px}
.carousel-section p.sub{font-size:13px;color:#3d6b45;margin-bottom:28px}
.scene{perspective:1200px;width:520px;max-width:92vw;height:320px;margin:0 auto}
.stage{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.25,.46,.45,.94)}
.c-card{position:absolute;width:480px;max-width:88vw;height:300px;left:calc(50% - 240px);border-radius:16px;overflow:hidden;backface-visibility:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3);border:2px solid #2d7a3a44}
.c-card img{width:100%;height:100%;object-fit:cover}
.c-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,20,5,.7),transparent 55%)}
.c-lbl{position:absolute;bottom:14px;right:16px;text-align:right}
.c-lbl h4{font-size:16px;font-weight:800;color:#fff}
.c-lbl p{font-size:11px;color:#a0d4a8;margin-top:2px}
.thumbs{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.thumb{width:62px;height:40px;border-radius:7px;overflow:hidden;cursor:pointer;border:2px solid transparent;opacity:.5;transition:all .3s}
.thumb.on{border-color:var(--primary);opacity:1;transform:scale(1.1)}
.thumb img{width:100%;height:100%;object-fit:cover}
.c-nav{display:flex;gap:10px;margin-top:14px;justify-content:center;align-items:center}
.c-btn{background:rgba(45,122,58,.15);border:2px solid var(--primary);color:var(--primary);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;transition:all .3s;font-family:inherit}
.c-btn:hover{background:var(--primary);color:#fff}
.c-badge{background:rgba(45,122,58,.1);border:1px solid #2d7a3a44;padding:5px 14px;border-radius:20px;font-size:12px;color:var(--primary)}
/* SECTIONS */
section.sec{padding:70px 40px}
section.sec.alt{background:var(--alt-bg)}
.sec-inner{max-width:1000px;margin:0 auto}
.sec h2{font-family:var(--font-heading);font-size:var(--section-title-size);font-weight:var(--font-heading-weight);font-style:var(--font-heading-style);margin-bottom:28px;color:var(--text-color)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.card{background:#fff;border:1px solid #c8e0cb;border-radius:14px;padding:22px;transition:all .3s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #2d7a3a22;border-color:#2d7a3a44}
.card-icon{font-size:30px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text-color)}
.card p{color:#3d6b45;font-size:var(--body-text-size);line-height:1.7}
.proj-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#fff;border:1px solid #c8e0cb;border-radius:12px;margin-bottom:10px}
.proj-info{display:flex;align-items:center;gap:14px}
.proj-icon{width:40px;height:40px;background:#2d7a3a12;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.proj-name{font-weight:700;font-size:15px;color:var(--text-color)}
.proj-type{color:#5a7a5e;font-size:12px;margin-top:2px}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700}
.badge-g{background:#d4f0da;color:#0d3b18;border:1px solid var(--primary-dark)}
.badge-y{background:#fff3cd;color:#7a4f00;border:1px solid #d4a017}
/* CTA */
.cta{padding:60px 40px;text-align:center;background:linear-gradient(135deg,#d4ecda,var(--alt-bg))}
.cta h2{font-size:28px;font-weight:900;margin-bottom:12px;color:var(--text-color)}
.cta p{color:#3d6b45;margin-bottom:24px;font-size:14px}
footer{padding:20px 40px;border-top:1px solid #c8e0cb;display:flex;justify-content:space-between;font-size:12px;color:#6a8a6e}
/* AUTH MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(13,32,16,.75);backdrop-filter:blur(8px);z-index:400;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:74px 16px 60px}
.modal{background:#fff;border:1px solid #c8e0cb;border-radius:20px;padding:28px 24px;width:100%;max-width:420px;position:relative}
.modal-close{position:absolute;top:12px;left:12px;background:none;border:none;font-size:24px;cursor:pointer;color:#5a7a5e}
.modal-logo{width:44px;height:44px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;margin:0 auto 10px}
.modal-title{text-align:center;margin-bottom:20px}
.modal-title h2{font-size:18px;font-weight:800;color:var(--text-color)}
.modal-title p{color:#5a7a5e;font-size:12px;margin-top:4px}
.tabs{display:flex;background:var(--page-bg);border-radius:10px;padding:4px;margin-bottom:18px}
.tab-btn{flex:1;padding:9px;border:none;border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:all .3s;background:transparent;color:#5a7a5e}
.tab-btn.on{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
.inp{width:100%;padding:12px 14px;background:#f5faf6;border:1.5px solid #b8d4bc;border-radius:8px;color:var(--text-color);font-size:16px;font-family:inherit;outline:none;transition:border-color .3s;margin-bottom:12px}
.inp:focus{border-color:var(--primary)}
.pw-wrap{position:relative;margin-bottom:12px}
.pw-wrap .inp{margin-bottom:0;padding-left:44px}
.pw-eye{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:#5a7a5e}
.lbl{font-size:12px;color:#5a7a5e;margin-bottom:5px;display:block;font-weight:600}
.err{background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
.suc{background:#f0fdf4;border:1px solid #86efac;color:#16a34a;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
select.inp{appearance:none}

.b46-section{padding:70px 40px;background:#f5faf6}
.b46-inner{max-width:1000px;margin:0 auto}
.b46-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.b46-card{background:#fff;border:1px solid #c8e0cb;border-radius:14px;overflow:hidden;cursor:pointer;transition:all .3s;position:relative}
.b46-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px #2d7a3a22;border-color:#2d7a3a66}
.b46-card img{width:100%;height:220px;object-fit:cover;display:block;transition:transform .4s}
.b46-card:hover img{transform:scale(1.04)}
.b46-card-body{padding:16px}
.b46-card-body h4{font-size:15px;font-weight:800;color:var(--text-color);margin-bottom:4px}
.b46-card-body p{font-size:13px;color:#3d6b45}
.b46-badge{position:absolute;top:12px;right:12px;background:rgba(45,122,58,0.85);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px)}
/* Modal برای نمایش بزرگ */
.img-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.img-modal-close{position:absolute;top:16px;left:16px;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:28px;cursor:pointer;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.img-modal-close:hover{background:rgba(255,255,255,0.3)}
.img-modal-img{max-width:90vw;max-height:85vh;border-radius:12px;object-fit:contain}
.img-modal-caption{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:15px;font-weight:700;background:rgba(0,0,0,0.5);padding:8px 20px;border-radius:20px;white-space:nowrap}

.ann-section{padding:60px 40px;background:#fff}
.ann-inner{max-width:1100px;margin:0 auto}
.ann-row{display:flex;gap:16px;overflow-x:auto;padding:22px 4px 10px;scroll-snap-type:x proximity}
.ann-row::-webkit-scrollbar{height:8px}
.ann-row::-webkit-scrollbar-thumb{background:#c8e0cb;border-radius:10px}
.ann-card{flex:0 0 220px;scroll-snap-align:start;background:#fff;border:1px solid #c8e0cb;border-radius:14px;overflow:hidden;cursor:pointer;transition:all .3s}
.ann-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(45,122,58,.15);border-color:#2d7a3a55}
.ann-card img{width:100%;height:220px;object-fit:cover;display:block}
.ann-empty{color:#888;font-size:14px}
.img-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.img-modal-close{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:28px;cursor:pointer;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.img-modal-img{max-width:90vw;max-height:85vh;border-radius:12px;object-fit:contain}
.img-modal-caption{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:15px;font-weight:700;background:rgba(0,0,0,.5);padding:8px 20px;border-radius:20px;white-space:nowrap}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--alt-bg)}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
</style>
</head>

function loadGoogleFont(href){
  if(document.querySelector('link[href="'+href+'"]')) return; // این فونت از قبل لود شده
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = href;
  document.head.appendChild(link);
}
// نگاشت اسم فیلد توی جدول site_content به متغیر CSS متناظرش
var THEME_VARS = {
  theme_primary:"--primary", theme_primary_dark:"--primary-dark", theme_primary_light:"--primary-light",
  theme_hero_highlight:"--hero-highlight", theme_page_bg:"--page-bg", theme_alt_bg:"--alt-bg",
  theme_text_color:"--text-color"
};
var THEME_SIZE_VARS = { theme_hero_title_size:"--hero-title-size", theme_hero_desc_size:"--hero-desc-size", theme_section_title_size:"--section-title-size", theme_body_text_size:"--body-text-size" };
// نگاشت اسم فیلد توی جدول site_content به متغیر CSS فونت متناظرش — هرکدوم جدا قابل انتخابه
var FONT_SLOT_VARS = {
  theme_font_hero:"--font-hero", theme_font_heading:"--font-heading", theme_font_body:"--font-body"
};
// نگاشت اسم فیلد توی جدول site_content به متغیر CSS وزن فونت (بولد بودن) متناظرش
var FONT_WEIGHT_VARS = {
  theme_font_hero_weight:"--font-hero-weight", theme_font_hero_desc_weight:"--font-hero-desc-weight",
  theme_font_heading_weight:"--font-heading-weight", theme_font_body_weight:"--font-body-weight"
};
// نگاشت اسم فیلد به متغیر CSS ایتالیک‌بودن متناظرش
var FONT_STYLE_VARS = {
  theme_font_hero_italic:"--font-hero-style", theme_font_heading_italic:"--font-heading-style", theme_font_body_italic:"--font-body-style"
};
function applyTheme(c){
  if(!c) return;
  Object.keys(THEME_VARS).forEach(function(key){
    if(c[key]) document.documentElement.style.setProperty(THEME_VARS[key], c[key]);
  });
  Object.keys(THEME_SIZE_VARS).forEach(function(key){
    if(c[key]) document.documentElement.style.setProperty(THEME_SIZE_VARS[key], c[key]+"px");
  });
  Object.keys(FONT_WEIGHT_VARS).forEach(function(key){
    if(c[key]) document.documentElement.style.setProperty(FONT_WEIGHT_VARS[key], c[key]);
  });
  Object.keys(FONT_STYLE_VARS).forEach(function(key){
    document.documentElement.style.setProperty(FONT_STYLE_VARS[key], c[key] ? "italic" : "normal");
  });
  // فونت متن عادی (theme_font_body) پیش‌فرضِ بقیه بخش‌هاست؛ هدر و تیترها اگه جدا انتخاب نشده باشن ازش پیروی می‌کنن (توی CSS با var(--font-body) تعریف شده)
  var legacy = c.theme_font; // سازگاری با ذخیره‌های قدیمی‌تر که یک فونت واحد داشتن
  Object.keys(FONT_SLOT_VARS).forEach(function(key){
    var chosen = c[key] || (key==="theme_font_body" ? legacy : null);
    if(chosen && FONT_PRESETS[chosen]){
      var f = FONT_PRESETS[chosen];
      if(f.href) loadGoogleFont(f.href); // فونت‌های محلی href ندارن، نیازی به لود از گوگل نیست
      document.documentElement.style.setProperty(FONT_SLOT_VARS[key], f.family);
    }
  });
}

// Render engine
function h(tag, attrs, children){
  var el = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==="style"){Object.assign(el.style, attrs[k]);}
    else if(k==="className"){el.className=attrs[k];}
    else if(k.startsWith("on")){el[k.toLowerCase()]=attrs[k];}
    else{el.setAttribute(k,attrs[k]);}
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c===null||c===undefined)return;
      el.appendChild(typeof c==="string"?document.createTextNode(c):c);
    });
  }
  return el;
}

var carPaused=false;
var carTimer=null;
function spin(d){state.carRy+=d*72;state.carIdx=((state.carIdx-d)%5+5)%5;update();}
function goTo(i){var diff=i-state.carIdx;state.carRy-=diff*72;state.carIdx=i;update();}

function buildAuthModal(){
  var bg=h("div",{className:"modal-bg"});

  var modal=h("div",{className:"modal"});

  var logo=h("div",{className:"modal-logo"},["T"]);
  modal.appendChild(logo);
  var mt=h("div",{className:"modal-title"});

  mt.appendChild(h("p",{},[" پرتال اختصاصی اعضای تعاونی"]));
  modal.appendChild(mt);

  var tabs=h("div",{className:"tabs"});
  ["login","register"].forEach(function(m,i){

  modal.appendChild(h("label",{className:"lbl"},["ایمیل"]));

  modal.appendChild(ei);

  modal.appendChild(h("label",{className:"lbl"},["رمز عبور"]));
  var pw=h("div",{className:"pw-wrap"});
  var pi=h("input",{className:"inp",type:state.showPass?"text":"password",placeholder:"رمز عبور",value:state.form.password,autocomplete:"current-password",autocorrect:"off",autocapitalize:"off",spellcheck:"false"});
  pi.oninput=function(){state.form.password=this.value;};
  var eye=h("button",{className:"pw-eye"},[state.showPass?"🙈":"👁️"]);
  eye.onclick=function(){state.showPass=!state.showPass;update();};
  pw.appendChild(pi);pw.appendChild(eye);
  modal.appendChild(pw);

  if(state.authMode==="register"){
    modal.appendChild(h("label",{className:"lbl"},["شماره تلفن"]));
    var phi=h("input",{className:"inp",type:"tel",placeholder:"۰۹۱۲۰۰۰۰۰۰۰",value:state.form.phone});
    phi.oninput=function(){state.form.phone=this.value;};
    modal.appendChild(phi);
    modal.appendChild(h("label",{className:"lbl"},["سمت / تخصص"]));
    var sel=h("select",{className:"inp"});
    ROLES.forEach(function(r){var o=h("option",{value:r},[r]);if(state.form.role===r)o.selected=true;sel.appendChild(o);});
    sel.onchange=function(){state.form.role=this.value;};
    modal.appendChild(sel);
  }

  var sb=h("button",{className:"btn btn-g",style:{width:"100%",marginTop:"6px"}},
    [state.authMode==="login"?"ورود به حساب":"ایجاد حساب کاربری"]);
  sb.onclick=function(){state.authMode==="login"?doLogin():doRegister();};
  modal.appendChild(sb);

  if(state.authMode==="login"){
    var hint=h("div",{style:{textAlign:"center",fontSize:"12px",color:"#6a8a6e",marginTop:"12px"}},["تست: ahmad@example.com / 1234"]);
    modal.appendChild(hint);
  }

  return bg;
}

function doLogin(){
  state.error="";
  var u=state.users.find(function(u){return u.email.trim()===state.form.email.trim()&&u.password===state.form.password;});
  if(!u){state.error="ایمیل یا رمز عبور اشتباه است";update();return;}
  state.currentUser=u;dbSet(CUR_KEY,u);
  state.showAuth=false;state.page="dashboard";
  state.form={name:"",email:"",password:"",phone:"",role:""};
  update();
}

function doRegister(){
  state.error="";
  var f=state.form;
  if(!f.name||!f.email||!f.password||!f.phone||!f.role){state.error="لطفاً تمام فیلدها را پر کنید";update();return;}
  if(state.users.find(function(u){return u.email===f.email;})){state.error="این ایمیل قبلاً ثبت شده است";update();return;}
  var nu={id:Date.now(),name:f.name,email:f.email,password:f.password,role:f.role,phone:f.phone,joinDate:new Date().toLocaleDateString("fa-IR"),dept:"جدید",photo:null,bio:""};
  state.users.push(nu);dbSet(USERS_KEY,state.users);
  state.success="✅ ثبت‌نام موفق! اکنون وارد شوید.";
  state.authMode="login";state.form={name:"",email:"",password:"",phone:"",role:""};
  update();
}

<script>
const SUPABASE_URL = "https://gsqwuibzplwalrahevdc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8duEw2Pj-B8fEupNzDzHag_CHN0riMC";
// توجه: اسمش supabaseClient گذاشتیم نه supabase، چون خود کتابخونه از قبل یه متغیر سراسری
// به اسم supabase ساخته (var supabase = ...) و اگه اینجا هم const supabase بسازیم، تداخل اسم
// (SyntaxError: Identifier 'supabase' has already been declared) کل اسکریپت رو متوقف می‌کنه.
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadHeaderImagesFromSupabase(){
  const { data: files, error } = await supabaseClient.storage.from('header').list('', {
    sortBy: { column: 'created_at', order: 'asc' }
  });
  if (error || !files || files.length === 0) return; // اگه چیزی نبود، همون عکس‌های پیش‌فرض می‌مونن
  const urls = files.map(f => supabaseClient.storage.from('header').getPublicUrl(f.name).data.publicUrl);
  if (window.setHeaderImages) window.setHeaderImages(urls);
}

async function loadProjectsFromSupabase(){
  const { data, error } = await supabaseClient.from('projects').select('*').order('sort_order', { ascending: true });
  if (error || !data || data.length === 0) return; // اگه چیزی نبود، همون لیست ثابت می‌مونه
  if (window.setProjects) window.setProjects(data);
}

async function loadSiteContentFromSupabase(){
  const { data, error } = await supabaseClient.from('site_content').select('*').eq('id', 1).single();
  if (error || !data) return; // اگه ردیفی نبود، همون متن‌های پیش‌فرض می‌مونن
  if (window.setSiteContent) window.setSiteContent(data);
}

async function loadAnnouncementsFromSupabase(){
  const { data: files, error } = await supabaseClient.storage.from('announcements').list('', {
    sortBy: { column: 'created_at', order: 'desc' }
  });
  if (error || !files || files.length === 0) return; // اگه چیزی نبود، بخش خالی نشون داده می‌شه
  const urls = files.map(f => supabaseClient.storage.from('announcements').getPublicUrl(f.name).data.publicUrl);
  if (window.setAnnouncements) window.setAnnouncements(urls);
}

loadHeaderImagesFromSupabase();
loadProjectsFromSupabase();
loadSiteContentFromSupabase();
loadAnnouncementsFromSupabase();
</script>
