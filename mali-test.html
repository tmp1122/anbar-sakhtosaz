<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>[تست] مغایرت فاکتور و انبار</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#f4efe2; --paper2:#eae2cd; --card:#fffdf8; --rule:#d9cfb4;
  --ink:#2b2419; --ink-muted:#7a6f5c;
  --navy:#1f4e79; --navy-dim:#e4edf5;
  --green:#2f6b3f; --green-dim:#e5efe3;
  --red:#a5372a; --red-dim:#f6e4e0;
  --amber:#8a5a00; --amber-dim:#fbf0d6;
  --purple:#5a3a8f; --purple-dim:#e6dcf5;
  --grey:#6b6455; --grey-dim:#ece6d6;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
body{font-family:'Vazirmatn',sans-serif;min-height:100vh;font-size:14.5px;}
:root{color-scheme:light;}
input,select,button{font-family:inherit;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;}

.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.topbar .ttl{font-size:17px;font-weight:800;}
.topbar .sub{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 60px;}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 0 var(--rule);}
.card h3{margin:0 0 4px;font-size:15px;}
.muted{color:var(--ink-muted);font-size:12.5px;}
.btn{background:var(--navy);color:#fff;border:none;padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;}
.btn:disabled{opacity:.5;cursor:default;}
.btn-outline{background:var(--card);color:var(--navy);border:2px solid var(--navy);}
.btn-green{background:var(--green);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.btn-link{background:none;border:none;color:var(--navy);font-weight:700;font-size:12.5px;cursor:pointer;padding:2px 4px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;min-width:140px;flex:1;}
.field label{font-size:12px;color:var(--ink-muted);font-weight:600;}
input[type=text],input[type=password],input[type=number],select{
  width:100%;background:var(--card);border:1.5px solid var(--rule);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:14px;}
input:focus,select:focus{outline:none;border-color:var(--navy);}
select option{color:#2b2419;background:#fffdf8;}
input[type=file]{width:100%;font-size:13px;color:var(--ink-muted);}
.error-box{background:var(--red-dim);border:1.5px solid var(--red);color:var(--red);padding:10px 14px;border-radius:11px;margin-bottom:12px;font-size:13px;font-weight:600;}
.hint{background:var(--navy-dim);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--navy);margin:10px 0;line-height:1.9;}
.warn{background:var(--amber-dim);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--amber);margin:10px 0;line-height:1.9;}

/* ورود */
.login{max-width:380px;margin:9vh auto 0;padding:0 16px;}
.login .box{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:24px 20px;}
.login h1{font-size:19px;margin:0 0 4px;text-align:center;}
.login .sub{font-size:12.5px;color:var(--ink-muted);text-align:center;margin-bottom:18px;}

/* خلاصه و نمودار */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.tile{background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:12px;text-align:center;cursor:pointer;}
.tile .n{font-size:24px;font-weight:900;font-family:var(--mono);}
.tile .l{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
.tile.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset;}
.tile.ok .n{color:var(--green);} .tile.bad .n{color:var(--red);} .tile.warn .n{color:var(--amber);} .tile.info .n{color:var(--purple);}
.bars{display:flex;flex-direction:column;gap:7px;}
.bar{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;}
.bar .track{background:var(--paper2);border-radius:6px;height:16px;overflow:hidden;}
.bar .fill{height:100%;border-radius:6px;min-width:2px;}
.bar .c{font-family:var(--mono);font-weight:700;text-align:left;}

/* جدول */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--card);}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px;}
th{background:var(--paper2);text-align:right;padding:9px 10px;font-size:12px;position:sticky;top:0;white-space:nowrap;border-bottom:2px solid var(--ink);}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;}
tr:last-child td{border-bottom:none;}
td.q{text-align:left;font-family:var(--mono);white-space:nowrap;}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.s-ok{background:var(--green-dim);color:var(--green);}
.s-short,.s-missing{background:var(--red-dim);color:var(--red);}
.s-over,.s-approx_diff{background:var(--amber-dim);color:var(--amber);}
.s-approx_ok{background:var(--green-dim);color:var(--green);}
.s-extra{background:var(--purple-dim);color:var(--purple);}
.s-noinv{background:var(--grey-dim);color:var(--grey);}
.d-neg{color:var(--red);font-weight:700;} .d-pos{color:var(--amber);font-weight:700;} .d-zero{color:var(--green);}
.note{font-size:11.5px;color:var(--ink-muted);line-height:1.8;}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:12px 0;}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);padding-bottom:10px;}
.preview{overflow-x:auto;margin-top:10px;border:1px solid var(--rule);border-radius:10px;}
.preview table{min-width:0;font-size:12px;}
.empty{color:var(--ink-muted);text-align:center;padding:34px 12px;}
</style>
</head>
<body>
<div id="app"></div>
<div style="position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#b3261e;color:#fff;text-align:center;font:700 12px sans-serif;padding:5px;pointer-events:none;opacity:.92">⚠ نسخه‌ی آزمایشی — داده‌ها واقعی نیستند</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ⚠️ اطلاعات پروژه‌ی Supabase (همان پروژه‌ی برنامه‌ی انبار) */
const SUPABASE_URL = "https://otfciaqfccrifwsvmxlg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_CnWE72Bm5Zjq8S6sVw9ASA_57m-CVAK";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const SESSION_KEY = "mali-test-session";
const MAP_KEY = "mali-test-map";
const ALLOWED_ROLES = ["finance","ceo","super"];

/* ============================================================ ابزارهای متن و عدد ============================================================ */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toLatinDigits(str){
  if(str==null) return "";
  var fa="۰۱۲۳۴۵۶۷۸۹", ar="٠١٢٣٤٥٦٧٨٩";
  return String(str).replace(/[۰-۹]/g,function(d){return fa.indexOf(d);}).replace(/[٠-٩]/g,function(d){return ar.indexOf(d);});
}
function normFa(s){ return String(s==null?"":s).replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/ـ/g,"").replace(/[‌‏‎]/g," "); }
function normName(s){
  return toLatinDigits(normFa(s)).toLowerCase().replace(/[()\[\]{}«»"'،,.:;\-_\/\\×*+]/g," ").replace(/\s+/g," ").trim();
}
function normInv(s){
  var t=toLatinDigits(normFa(s)).toLowerCase().replace(/[\s\-_\/\\.]/g,"");
  if(/^\d+$/.test(t)) t=t.replace(/^0+(?=\d)/,"");
  return t;
}
function toNum(v){
  if(typeof v==="number") return isFinite(v)?v:null;
  var t=toLatinDigits(normFa(v)).replace(/[٬,،\s]/g,"").replace(/٫/g,".");
  if(t===""||!/^-?\d*\.?\d+$/.test(t)) return null;
  return parseFloat(t);
}
function fmtNum(n){ if(n==null||isNaN(n)) return "—"; return String(Number(Number(n).toFixed(3))); }
function fmtDiff(n){ if(n==null||isNaN(n)) return "—"; var v=Number(Number(n).toFixed(3)); return (v>0?"+":"")+v; }
var dtf=null;
function fmtDate(iso){
  try{ if(!dtf) dtf=new Intl.DateTimeFormat("fa-IR-u-nu-latn",{year:"numeric",month:"2-digit",day:"2-digit"}); return dtf.format(new Date(iso)); }
  catch(e){ return String(iso||"").slice(0,10); }
}
function tokens(s){ return normName(s).split(" ").filter(function(x){return x.length>1;}); }
function similarity(a,b){
  var A=tokens(a), B=tokens(b); if(!A.length||!B.length) return 0;
  var sb2={}; B.forEach(function(x){sb2[x]=1;});
  var inter=0; A.forEach(function(x){ if(sb2[x]) inter++; });
  var union=A.length+B.length-inter;
  var jac=inter/union, cont=inter/Math.min(A.length,B.length);
  return Math.max(jac, cont*0.85);
}

/* ============================================================ خواندن فایل اکسل ============================================================ */
function detectHeader(rows){
  var lim=Math.min(rows.length,30);
  for(var i=0;i<lim;i++){
    var txt=0;
    (rows[i]||[]).forEach(function(c){ if(typeof c==="string" && c.trim()!=="" && toNum(c)===null) txt++; });
    if(txt>=2) return i;
  }
  return 0;
}
function guessCols(headers){
  var hs=headers.map(function(x){return normName(x);});
  var used=[];
  function find(list,avoid){
    for(var k=0;k<list.length;k++){
      for(var i=0;i<hs.length;i++){
        if(used.indexOf(i)>=0) continue;
        if(avoid && avoid.test(hs[i])) continue;
        if(list[k].test(hs[i])) return i;
      }
    }
    return -1;
  }
  var inv=find([/شماره\s*(فاکتور|صورتحساب|سند)/,/(invoice|inv)\s*(no|number|#)?/,/فاکتور|صورتحساب/],/تاریخ|date/); if(inv>=0) used.push(inv);
  var qty=find([/تعداد/,/مقدار/,/qty|quantity|count/]); if(qty>=0) used.push(qty);
  var name=find([/نام\s*کالا/,/شرح\s*کالا|شرح/,/کالا|محصول|مشخصات/,/نام/,/description|item|product/]); if(name>=0) used.push(name);
  return {inv:inv,name:name,qty:qty};
}
function buildLines(rows,hdrIdx,cols){
  var lines=[], skipped=[];
  for(var i=hdrIdx+1;i<rows.length;i++){
    var r=rows[i]||[];
    var name=String(cols.name>=0&&r[cols.name]!=null?r[cols.name]:"").trim();
    var inv=String(cols.inv>=0&&r[cols.inv]!=null?r[cols.inv]:"").trim();
    var qty=cols.qty>=0?toNum(r[cols.qty]):null;
    if(!name && qty==null && !inv) continue;
    if(/^(جمع|مجموع|total|sum)/i.test(normName(name))) continue;
    if(!name || qty==null){ skipped.push(i+1); continue; }
    lines.push({inv:inv, invNorm:normInv(inv), name:name, norm:normName(name), qty:qty, row:i+1});
  }
  return {lines:lines, skipped:skipped};
}

/* ============================================================ منطق مقایسه ============================================================ */
var STATUS = {
  missing:    {label:"ثبت‌نشده در انبار",       sev:0},
  short:      {label:"کسری در انبار",           sev:1},
  over:       {label:"اضافه در انبار",          sev:2},
  approx_diff:{label:"مغایرت (تطبیق تقریبی)",   sev:3},
  extra:      {label:"فقط در انبار",            sev:4},
  approx_ok:  {label:"برابر (تطبیق تقریبی)",    sev:5},
  ok:         {label:"برابر",                   sev:6},
  noinv:      {label:"ورودی بدون شماره فاکتور", sev:7}
};
var BAR_COLORS = {missing:"#a5372a",short:"#c9574a",over:"#c28a1c",approx_diff:"#d9a84e",extra:"#7b5bb3",approx_ok:"#6a9a73",ok:"#2f6b3f",noinv:"#9b9382"};

function compare(lines, wh, opts){
  var tol=Math.abs(opts.tol||0), manual=opts.manual||{}, fallback=!!opts.fallback;
  var items=new Map();
  wh.forEach(function(r){ if(!items.has(r.item_id)) items.set(r.item_id,{id:r.item_id,name:r.item_name,code:r.item_code,norm:normName(r.item_name)}); });
  var byName=new Map();
  items.forEach(function(it){ byName.set(it.norm,it.id); if(it.code) byName.set(normName(it.code),it.id); });

  // سمت انبار
  var whGroups=new Map(), noInv=new Map(), invsOfItem=new Map();
  wh.forEach(function(r){
    var q=Number(r.quantity)||0, inv=normInv(r.invoice_no);
    if(inv){
      var k=inv+"|"+r.item_id, g=whGroups.get(k);
      if(!g){ g={inv:r.invoice_no, invNorm:inv, itemId:r.item_id, qty:0, rows:[], used:false}; whGroups.set(k,g); }
      g.qty+=q; g.rows.push(r);
      var s=invsOfItem.get(r.item_id)||{}; s[r.invoice_no]=1; invsOfItem.set(r.item_id,s);
    } else {
      var n=noInv.get(r.item_id);
      if(!n){ n={itemId:r.item_id, qty:0, rows:[], used:false}; noInv.set(r.item_id,n); }
      n.qty+=q; n.rows.push(r);
    }
  });

  // سمت فاکتور (گروه‌بندی ردیف‌های تکراری یک کالا در یک فاکتور)
  var invoicesInFile={}, groups=new Map();
  lines.forEach(function(l){
    var itemId = manual[l.norm] || byName.get(l.norm) || null;
    if(itemId && !items.has(itemId)) itemId=null;
    if(l.invNorm) invoicesInFile[l.invNorm]=1;
    var ikey = itemId ? itemId : "n:"+l.norm;
    var k=l.invNorm+"|"+ikey, g=groups.get(k);
    if(!g){ g={inv:l.inv, invNorm:l.invNorm, itemId:itemId, name:l.name, norm:l.norm, qty:0, rows:[]}; groups.set(k,g); }
    g.qty+=l.qty; g.rows.push(l.row);
  });

  function whInfo(rows){
    var dates=rows.map(function(r){return r.tx_datetime;}).sort();
    var sellers={}; rows.forEach(function(r){ if(r.seller_name) sellers[r.seller_name]=1; });
    var urlRow=rows.filter(function(r){return r.invoice_file_url;})[0];
    return {date:dates.length?fmtDate(dates[0]):"", seller:Object.keys(sellers).join("، "), url:urlRow?urlRow.invoice_file_url:""};
  }

  var out=[];
  groups.forEach(function(g){
    var row={status:"missing", inv:g.inv, invName:g.name, itemId:g.itemId, itemName:g.itemId?items.get(g.itemId).name:"",
             invQty:g.qty, whQty:null, diff:null, note:"", excelRows:g.rows, date:"", seller:"", url:"", norm:g.norm};
    var wg = (g.itemId && g.invNorm) ? whGroups.get(g.invNorm+"|"+g.itemId) : null;
    if(wg){
      wg.used=true; row.whQty=wg.qty; row.diff=wg.qty-g.qty;
      row.status = Math.abs(row.diff)<=tol ? "ok" : (row.diff<0?"short":"over");
      var wi=whInfo(wg.rows); row.date=wi.date; row.seller=wi.seller; row.url=wi.url;
    } else {
      var nv = (g.itemId && fallback) ? noInv.get(g.itemId) : null;
      if(nv && !nv.used){
        nv.used=true; row.whQty=nv.qty; row.diff=nv.qty-g.qty;
        row.status = Math.abs(row.diff)<=tol ? "approx_ok" : "approx_diff";
        row.note="ورودی‌های این کالا در انبار شماره‌ی فاکتور ندارند؛ تطبیق فقط بر اساس نام کالا است";
        var wi2=whInfo(nv.rows); row.date=wi2.date; row.seller=wi2.seller; row.url=wi2.url;
      } else {
        row.status="missing";
        if(!g.itemId) row.note="نام این کالا در انبار پیدا نشد؛ اگر در انبار با نام دیگری ثبت شده، پایین همین ردیف پیوند بزنید";
        else {
          var other=invsOfItem.get(g.itemId);
          row.note = other ? ("این کالا در انبار با شماره‌ی فاکتور دیگری ثبت شده: "+Object.keys(other).join("، ")) : "ورودی‌ای برای این کالا/فاکتور در انبار نیست";
        }
      }
    }
    out.push(row);
  });

  whGroups.forEach(function(g){
    if(g.used) return;
    var wi=whInfo(g.rows);
    out.push({status:"extra", inv:g.inv, invName:"—", itemId:g.itemId, itemName:items.get(g.itemId).name,
      invQty:null, whQty:g.qty, diff:g.qty, excelRows:[], date:wi.date, seller:wi.seller, url:wi.url, norm:"",
      note: invoicesInFile[g.invNorm] ? "این فاکتور در فایل اکسل هست ولی این کالا در آن نیست" : "شماره‌ی این فاکتور در فایل اکسل نیست"});
  });
  noInv.forEach(function(n){
    if(n.used) return;
    var wi=whInfo(n.rows);
    out.push({status:"noinv", inv:"—", invName:"—", itemId:n.itemId, itemName:items.get(n.itemId).name,
      invQty:null, whQty:n.qty, diff:null, excelRows:[], date:wi.date, seller:wi.seller, url:wi.url, norm:"",
      note:"ورودی بدون شماره‌ی فاکتور ("+n.rows.length+" ردیف)؛ با فاکتورهای فایل تطبیق نخورد"});
  });
  return {rows:out, items:Array.from(items.values())};
}

/* ============================================================ حالت برنامه ============================================================ */
var app=document.getElementById("app");
var S={
  user:null, wh:[], whAt:null, busy:false, err:"",
  fileName:"", sheets:null, sheetName:"", hdrIdx:0, cols:{inv:-1,name:-1,qty:-1},
  lines:[], skipped:[], res:null, items:[],
  filter:"all", q:"", tol:0, fallback:true, showNoInv:false, sort:"sev"
};
function loadSession(){ try{ var v=localStorage.getItem(SESSION_KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
function saveSession(u){ try{ localStorage.setItem(SESSION_KEY,JSON.stringify(u)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function loadMap(){ try{ return JSON.parse(localStorage.getItem(MAP_KEY)||"{}")||{}; }catch(e){ return {}; } }
function saveMap(m){ try{ localStorage.setItem(MAP_KEY,JSON.stringify(m)); }catch(e){} }

function logout(){
  var u=S.user;
  if(u&&u.token){ try{ sb.rpc("logout",{p_token:u.token}); }catch(e){} }
  clearSession(); S.user=null; S.wh=[]; S.res=null; S.sheets=null; S.lines=[]; renderLogin("");
}
function authFailed(err){
  if(err && err.message && err.message.indexOf("نشست نامعتبر")>=0){ clearSession(); S.user=null; renderLogin("نشست شما تمام شده؛ دوباره وارد شوید"); return true; }
  return false;
}

/* ============================================================ ورود ============================================================ */
function renderLogin(msg){
  app.innerHTML =
    '<div class="login"><form class="box" id="loginForm" autocomplete="off">'
   +'<h1>مغایرت فاکتور و انبار</h1><div class="sub">تعاونی مسکن پالایشگاه گاز ولیعصر — ویژه‌ی مدیر مالی</div>'
   +(msg?'<div class="error-box">'+esc(msg)+'</div>':'')
   +'<div class="field" style="margin-bottom:12px"><label>کد کاربری</label><input type="text" id="lcode" autocomplete="username" inputmode="numeric"></div>'
   +'<div class="field" style="margin-bottom:16px"><label>رمز عبور</label><input type="password" id="lpass" autocomplete="current-password"></div>'
   +'<button class="btn" style="width:100%" type="submit" id="lbtn">ورود</button></form></div>';
}
async function doLogin(){
  var code=toLatinDigits(document.getElementById("lcode").value.trim());
  var pass=toLatinDigits(document.getElementById("lpass").value);
  if(!code||!pass){ renderLogin("کد و رمز را وارد کنید"); return; }
  var btn=document.getElementById("lbtn"); btn.disabled=true; btn.textContent="در حال ورود…";
  var res=await sb.rpc("login_session",{p_code:code,p_password:pass});
  if(res.error || !res.data){ renderLogin(res.error?("خطا: "+res.error.message):"کد یا رمز اشتباه است"); return; }
  var u=res.data;
  if(ALLOWED_ROLES.indexOf(u.role)<0){
    try{ await sb.rpc("logout",{p_token:u.token}); }catch(e){}
    renderLogin("این برنامه فقط برای مدیر مالی، مدیر عامل و مدیر سیستم است"); return;
  }
  S.user=u; saveSession(u); renderShell(); await loadReport();
}

/* ============================================================ دریافت ورودی‌های انبار ============================================================ */
async function loadReport(){
  S.busy=true; S.err=""; renderStatusBar();
  var res=await sb.rpc("finance_in_report",{p_token:S.user.token});
  S.busy=false;
  if(res.error){
    if(authFailed(res.error)) return;
    S.err="خطا در دریافت اطلاعات انبار: "+res.error.message
      +(/finance_in_report/.test(res.error.message)?" — فایل finance.sql هنوز در Supabase اجرا نشده است":"");
    renderStatusBar(); return;
  }
  S.wh=res.data||[]; S.whAt=new Date();
  renderStatusBar();
  if(S.lines.length) runCompare();
}

/* ============================================================ صفحه‌ی اصلی ============================================================ */
function renderShell(){
  app.innerHTML =
    '<div class="topbar"><div><div class="ttl">مغایرت فاکتور و انبار</div><div class="sub" id="who"></div></div>'
   +'<div style="display:flex;gap:8px;align-items:center"><button class="btn btn-outline btn-sm" data-act="refresh">بروزرسانی داده‌ی انبار</button>'
   +'<button class="btn btn-outline btn-sm" data-act="logout">خروج</button></div></div>'
   +'<div class="wrap">'
   +'<div id="statusBar"></div>'
   +'<div class="card"><h3>۱) فایل اکسل فاکتورها</h3>'
   +'<div class="muted">فایل شامل: شماره‌ی فاکتور، نام کالا و تعداد. هر ردیف یک کالا در یک فاکتور.</div>'
   +'<div style="margin-top:10px"><input type="file" id="file" accept=".xlsx,.xls,.csv" data-chg="file"></div>'
   +'<div id="mapArea"></div></div>'
   +'<div id="resultBlock" style="display:none">'
   +'<div class="card"><h3>۲) نتیجه‌ی مقایسه</h3><div id="skipInfo"></div>'
   +'<div class="tiles" id="tiles" style="margin-top:12px"></div>'
   +'<div class="bars" id="chart"></div></div>'
   +'<div class="card"><h3>۳) جدول مغایرت‌ها</h3>'
   +'<div class="fbar">'
   +'<div class="field" style="min-width:200px"><label>جستجو (کالا، فاکتور، فروشنده)</label><input type="text" id="q" autocomplete="off"></div>'
   +'<div class="field" style="max-width:210px"><label>وضعیت</label><select id="fstatus" data-chg="fstatus"></select></div>'
   +'<div class="field" style="max-width:170px"><label>ترتیب</label><select id="fsort" data-chg="fsort"><option value="sev">مغایرت‌ها اول</option><option value="file">ترتیب فایل اکسل</option></select></div>'
   +'<div class="field" style="max-width:130px"><label>اختلاف مجاز (تعداد)</label><input type="text" id="tol" inputmode="decimal" value="0" data-chg="tol"></div>'
   +'<label class="chk"><input type="checkbox" id="fallback" checked data-chg="fallback"> تطبیق ورودی‌های بدون شماره‌ی فاکتور با نام کالا</label>'
   +'<label class="chk"><input type="checkbox" id="shownoinv" data-chg="shownoinv"> نمایش ورودی‌های بدون شماره‌ی فاکتور</label>'
   +'<button class="btn btn-green btn-sm" data-act="export" style="margin-bottom:6px">خروجی اکسل</button>'
   +'</div>'
   +'<div id="table"></div></div>'
   +'</div></div>';
  document.getElementById("who").textContent=(S.user?S.user.name:"")+" — "+({finance:"مدیر مالی",ceo:"مدیر عامل",super:"مدیر سیستم"}[S.user.role]||"");
  renderStatusBar(); renderMap();
}
function renderStatusBar(){
  var el=document.getElementById("statusBar"); if(!el) return;
  var h="";
  if(S.err) h+='<div class="error-box">'+esc(S.err)+'</div>';
  if(S.busy) h+='<div class="hint">در حال دریافت ورودی‌های انبار…</div>';
  else if(S.whAt && !S.err){
    var noInvCount=S.wh.filter(function(r){return !normInv(r.invoice_no);}).length;
    h+='<div class="hint">ورودی‌های ثبت‌شده در انبار: <b class="num">'+S.wh.length+'</b> ردیف'
      +' — از این تعداد بدون شماره‌ی فاکتور: <b class="num">'+noInvCount+'</b>'
      +(noInvCount?' (برای مقایسه‌ی دقیق‌تر، شماره‌ی فاکتور را در برنامه‌ی انبار از «اصلاح» ثبت کنند)':'')+'</div>';
  }
  el.innerHTML=h;
}

/* ---- انتخاب ستون‌ها ---- */
function renderMap(){
  var el=document.getElementById("mapArea"); if(!el) return;
  if(!S.sheets){ el.innerHTML=""; return; }
  var names=Object.keys(S.sheets), rows=S.sheets[S.sheetName]||[];
  var headers=(rows[S.hdrIdx]||[]).map(function(x){return String(x==null?"":x).trim();});
  var maxc=0; rows.slice(S.hdrIdx,S.hdrIdx+8).forEach(function(r){ if((r||[]).length>maxc) maxc=r.length; });
  function opts(sel,optional){
    var o=optional?'<option value="-1"'+(sel<0?' selected':'')+'>— ندارد —</option>':'<option value="-1"'+(sel<0?' selected':'')+'>— انتخاب کنید —</option>';
    for(var i=0;i<maxc;i++){ o+='<option value="'+i+'"'+(sel===i?' selected':'')+'>'+esc((headers[i]||"")?headers[i]:("ستون "+(i+1)))+'</option>'; }
    return o;
  }
  var h='<div class="hint">فایل «'+esc(S.fileName)+'» خوانده شد ('+rows.length+' ردیف). ستون‌ها را بررسی کنید و اگر اشتباه حدس زده شد اصلاح کنید.</div>';
  h+='<div class="row">';
  if(names.length>1){
    h+='<div class="field"><label>برگه (Sheet)</label><select data-chg="sheet">'+names.map(function(n){return '<option'+(n===S.sheetName?' selected':'')+'>'+esc(n)+'</option>';}).join("")+'</select></div>';
  }
  h+='<div class="field" style="max-width:130px"><label>شماره‌ی ردیف عنوان‌ها</label><input type="text" inputmode="numeric" value="'+(S.hdrIdx+1)+'" data-chg="hdr"></div>';
  h+='<div class="field"><label>ستون شماره‌ی فاکتور</label><select data-chg="col" data-k="inv">'+opts(S.cols.inv,true)+'</select></div>';
  h+='<div class="field"><label>ستون نام کالا *</label><select data-chg="col" data-k="name">'+opts(S.cols.name,false)+'</select></div>';
  h+='<div class="field"><label>ستون تعداد *</label><select data-chg="col" data-k="qty">'+opts(S.cols.qty,false)+'</select></div>';
  h+='</div>';
  if(S.cols.inv<0) h+='<div class="warn">ستون شماره‌ی فاکتور انتخاب نشده؛ در این حالت تطبیق فقط با «نام کالا» روی ورودی‌های بدون شماره‌ی فاکتور انجام می‌شود و دقت پایین است.</div>';
  var pv=rows.slice(S.hdrIdx,S.hdrIdx+6);
  h+='<div class="preview"><table><tbody>'+pv.map(function(r,ri){
    var cells=[]; for(var c=0;c<maxc;c++){ cells.push('<'+(ri===0?'th':'td')+'>'+esc(r&&r[c]!=null?r[c]:"")+'</'+(ri===0?'th':'td')+'>'); }
    return '<tr>'+cells.join("")+'</tr>';
  }).join("")+'</tbody></table></div>';
  var ok=S.cols.name>=0&&S.cols.qty>=0;
  h+='<div style="margin-top:12px"><button class="btn" data-act="compare"'+(ok?'':' disabled')+'>مقایسه با انبار</button></div>';
  el.innerHTML=h;
}
function loadFile(file){
  if(!file) return;
  S.err=""; renderStatusBar();
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(reader.result),{type:"array"});
      var sheets={};
      wb.SheetNames.forEach(function(n){ sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:true}); });
      var first=wb.SheetNames.filter(function(n){return sheets[n].length>0;})[0];
      if(!first){ S.err="فایل خالی است"; renderStatusBar(); return; }
      S.fileName=file.name; S.sheets=sheets; S.sheetName=first; autoSheet(); renderMap();
      document.getElementById("resultBlock").style.display="none"; S.res=null; S.lines=[];
    }catch(e){ S.err="خواندن فایل ممکن نشد: "+e.message; renderStatusBar(); }
  };
  reader.onerror=function(){ S.err="خواندن فایل ممکن نشد"; renderStatusBar(); };
  reader.readAsArrayBuffer(file);
}
function autoSheet(){
  var rows=S.sheets[S.sheetName]||[];
  S.hdrIdx=detectHeader(rows);
  S.cols=guessCols((rows[S.hdrIdx]||[]).map(function(x){return String(x==null?"":x);}));
}

/* ---- اجرای مقایسه ---- */
function runCompare(){
  var rows=S.sheets?S.sheets[S.sheetName]:[];
  var b=buildLines(rows,S.hdrIdx,S.cols);
  S.lines=b.lines; S.skipped=b.skipped;
  if(!S.lines.length){ S.err="هیچ ردیف معتبری (نام کالا + تعداد) در فایل پیدا نشد؛ ستون‌ها را بررسی کنید"; renderStatusBar(); document.getElementById("resultBlock").style.display="none"; return; }
  S.err=""; renderStatusBar();
  var c=compare(S.lines,S.wh,{tol:S.tol,manual:loadMap(),fallback:S.fallback});
  S.res=c.rows; S.items=c.items;
  document.getElementById("resultBlock").style.display="";
  var sel=document.getElementById("fstatus");
  if(sel && !sel.options.length){
    sel.innerHTML='<option value="all">همه (به‌جز بدون شماره‌ی فاکتور)</option><option value="bad">فقط مغایرت‌ها</option>'
      +Object.keys(STATUS).map(function(k){return '<option value="'+k+'">'+STATUS[k].label+'</option>';}).join("");
  }
  renderResults();
}
function counts(){
  var c={}; Object.keys(STATUS).forEach(function(k){c[k]=0;});
  (S.res||[]).forEach(function(r){ c[r.status]++; });
  return c;
}
var BAD=["missing","short","over","approx_diff"];
function visibleRows(){
  var q=normName(S.q);
  var rows=(S.res||[]).filter(function(r){
    if(r.status==="noinv" && !S.showNoInv && S.filter!=="noinv") return false;
    if(S.filter==="bad") { if(BAD.indexOf(r.status)<0) return false; }
    else if(S.filter!=="all" && r.status!==S.filter) return false;
    if(q){
      var hay=normName([r.invName,r.itemName,r.inv,r.seller].join(" "));
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  if(S.sort==="sev"){
    var idx=new Map(); (S.res||[]).forEach(function(r,i){idx.set(r,i);});
    rows=rows.slice().sort(function(a,b){ return (STATUS[a.status].sev-STATUS[b.status].sev) || (idx.get(a)-idx.get(b)); });
  }
  return rows;
}
function renderResults(){
  if(!S.res) return;
  var c=counts();
  var okN=c.ok+c.approx_ok, badN=c.short+c.over+c.approx_diff;
  var total=S.res.length-c.noinv-c.extra;
  function tile(cls,n,l,f){ return '<div class="tile '+cls+(S.filter===f?' on':'')+'" data-act="filter" data-v="'+f+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
  document.getElementById("tiles").innerHTML=
      tile("",total,"ردیف فاکتور مقایسه‌شده","all")
    + tile("ok",okN,"برابر (✓)","ok")
    + tile("bad",badN,"مغایرت تعداد","bad")
    + tile("bad",c.missing,"ثبت‌نشده در انبار","missing")
    + tile("info",c.extra,"فقط در انبار","extra");
  var max=Math.max(1,c.missing,c.short,c.over,c.approx_diff,c.extra,c.approx_ok,c.ok);
  document.getElementById("chart").innerHTML=["ok","approx_ok","short","over","approx_diff","missing","extra"].map(function(k){
    return '<div class="bar" data-act="filter" data-v="'+k+'"><div>'+STATUS[k].label+'</div><div class="track"><div class="fill" style="width:'+Math.round(c[k]/max*100)+'%;background:'+BAR_COLORS[k]+'"></div></div><div class="c">'+c[k]+'</div></div>';
  }).join("");
  var info="";
  if(S.skipped.length) info+='<div class="warn">'+S.skipped.length+' ردیف فایل به‌دلیل نبودن نام کالا یا تعداد معتبر نادیده گرفته شد (ردیف‌ها: '+S.skipped.slice(0,15).join("، ")+(S.skipped.length>15?" …":"")+')</div>';
  document.getElementById("skipInfo").innerHTML=info;
  var fs=document.getElementById("fstatus"); if(fs) fs.value=S.filter;
  renderTable();
}
function renderTable(){
  var rows=visibleRows(), el=document.getElementById("table"); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="empty">ردیفی با این فیلتر نیست</div>'; return; }
  var map=loadMap();
  var h='<div class="muted" style="margin-bottom:6px">'+rows.length+' ردیف نمایش داده می‌شود</div><div class="tbl-wrap"><table><thead><tr>'
    +'<th>وضعیت</th><th>شماره‌ی فاکتور</th><th>کالا در فاکتور</th><th>کالا در انبار</th><th>تعداد فاکتور</th><th>تعداد انبار</th><th>اختلاف</th><th>توضیح</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var dcls = r.diff==null?"":(Math.abs(r.diff)<=S.tol?"d-zero":(r.diff<0?"d-neg":"d-pos"));
    var notes=[];
    if(r.excelRows.length) notes.push("ردیف اکسل: "+r.excelRows.slice(0,6).join("، ")+(r.excelRows.length>6?" …":""));
    if(r.date) notes.push("تاریخ ورود: "+r.date);
    if(r.seller) notes.push("فروشنده: "+esc(r.seller));
    var extra="";
    if(r.note) extra+='<div>'+esc(r.note)+'</div>';
    if(r.url) extra+='<div><a href="'+esc(r.url)+'" target="_blank" rel="noopener">مشاهده‌ی عکس فاکتور ثبت‌شده در انبار</a></div>';
    if(r.status==="missing" && r.norm){
      var opts='<option value="">پیوند به کالای انبار…</option>'+S.items.slice().sort(function(a,b){return a.name.localeCompare(b.name,"fa");}).map(function(it){return '<option value="'+esc(it.id)+'">'+esc(it.name)+'</option>';}).join("");
      extra+='<div style="margin-top:6px"><select data-chg="map" data-norm="'+esc(r.norm)+'" style="font-size:12px;padding:6px 8px">'+opts+'</select>';
      if(!r.itemId){
        var best=null,bs=0; S.items.forEach(function(it){ var s=similarity(r.invName,it.name); if(s>bs){bs=s;best=it;} });
        if(best&&bs>=0.5) extra+=' <button class="btn-link" data-act="accept" data-norm="'+esc(r.norm)+'" data-id="'+esc(best.id)+'">پیشنهاد: '+esc(best.name)+' ← قبول</button>';
      }
      extra+='</div>';
    }
    if(map[r.norm] && r.itemId && map[r.norm]===r.itemId) extra+='<div><button class="btn-link" data-act="unmap" data-norm="'+esc(r.norm)+'">حذف پیوند دستی</button></div>';
    h+='<tr><td><span class="badge s-'+r.status+'">'+STATUS[r.status].label+'</span></td>'
      +'<td class="q" style="text-align:right">'+esc(r.inv||"—")+'</td>'
      +'<td>'+esc(r.invName)+'</td><td>'+esc(r.itemName||"—")+'</td>'
      +'<td class="q">'+fmtNum(r.invQty)+'</td><td class="q">'+fmtNum(r.whQty)+'</td>'
      +'<td class="q '+dcls+'">'+fmtDiff(r.diff)+'</td>'
      +'<td class="note">'+notes.join(" · ")+extra+'</td></tr>';
  });
  h+='</tbody></table></div>';
  el.innerHTML=h;
}

/* ============================================================ خروجی اکسل ============================================================ */
function exportXlsx(){
  if(!S.res){ return; }
  var c=counts();
  var summary=[["گزارش مغایرت فاکتور و انبار"],["فایل فاکتور",S.fileName],["تاریخ تهیه",new Intl.DateTimeFormat("fa-IR-u-nu-latn",{dateStyle:"short",timeStyle:"short"}).format(new Date())],["تهیه‌کننده",S.user?S.user.name:""],[],["وضعیت","تعداد"]];
  Object.keys(STATUS).forEach(function(k){ summary.push([STATUS[k].label,c[k]]); });
  var head=["وضعیت","شماره‌ی فاکتور","کالا در فاکتور","کالا در انبار","تعداد فاکتور","تعداد انبار","اختلاف (انبار − فاکتور)","ردیف اکسل","تاریخ ورود به انبار","فروشنده","توضیح"];
  var data=[head];
  var sorted=S.res.slice().sort(function(a,b){return STATUS[a.status].sev-STATUS[b.status].sev;});
  sorted.forEach(function(r){
    data.push([STATUS[r.status].label,r.inv||"",r.invName==="—"?"":r.invName,r.itemName||"",r.invQty==null?"":r.invQty,r.whQty==null?"":r.whQty,r.diff==null?"":Number(r.diff.toFixed(3)),r.excelRows.join("، "),r.date,r.seller,r.note]);
  });
  var wb=XLSX.utils.book_new();
  var ws1=XLSX.utils.aoa_to_sheet(summary); ws1["!cols"]=[{wch:28},{wch:30}];
  var ws2=XLSX.utils.aoa_to_sheet(data); ws2["!cols"]=[{wch:24},{wch:16},{wch:30},{wch:30},{wch:12},{wch:12},{wch:18},{wch:14},{wch:14},{wch:20},{wch:50}];
  XLSX.utils.book_append_sheet(wb,ws1,"خلاصه");
  XLSX.utils.book_append_sheet(wb,ws2,"مغایرت‌ها");
  wb.Workbook={Views:[{RTL:true}]};
  var d=new Date(), p=function(n){return String(n).padStart(2,"0");};
  XLSX.writeFile(wb,"moghayerat-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".xlsx");
}

/* ============================================================ رویدادها ============================================================ */
app.addEventListener("submit",function(e){ if(e.target.id==="loginForm"){ e.preventDefault(); doLogin(); } });
app.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el) return;
  var act=el.getAttribute("data-act");
  if(act==="logout") logout();
  else if(act==="refresh") loadReport();
  else if(act==="compare") runCompare();
  else if(act==="export") exportXlsx();
  else if(act==="filter"){ S.filter=el.getAttribute("data-v"); renderResults(); }
  else if(act==="accept"){ var m=loadMap(); m[el.getAttribute("data-norm")]=el.getAttribute("data-id"); saveMap(m); runCompare(); }
  else if(act==="unmap"){ var m2=loadMap(); delete m2[el.getAttribute("data-norm")]; saveMap(m2); runCompare(); }
});
app.addEventListener("change",function(e){
  var el=e.target.closest("[data-chg]"); if(!el) return;
  var k=el.getAttribute("data-chg");
  if(k==="file") loadFile(el.files[0]);
  else if(k==="sheet"){ S.sheetName=el.value; autoSheet(); renderMap(); }
  else if(k==="hdr"){ var n=parseInt(toLatinDigits(el.value),10); var rows=S.sheets[S.sheetName]||[]; S.hdrIdx=Math.max(0,Math.min(rows.length-1,(isNaN(n)?1:n)-1)); S.cols=guessCols((rows[S.hdrIdx]||[]).map(function(x){return String(x==null?"":x);})); renderMap(); }
  else if(k==="col"){ S.cols[el.getAttribute("data-k")]=parseInt(el.value,10); renderMap(); }
  else if(k==="fstatus"){ S.filter=el.value; renderResults(); }
  else if(k==="fsort"){ S.sort=el.value; renderTable(); }
  else if(k==="tol"){ var t=toNum(el.value); S.tol=t==null?0:Math.abs(t); el.value=String(S.tol); if(S.lines.length) runCompare(); }
  else if(k==="fallback"){ S.fallback=el.checked; if(S.lines.length) runCompare(); }
  else if(k==="shownoinv"){ S.showNoInv=el.checked; renderTable(); }
  else if(k==="map"){ if(!el.value) return; var m=loadMap(); m[el.getAttribute("data-norm")]=el.value; saveMap(m); runCompare(); }
});
app.addEventListener("input",function(e){
  if(e.target.id==="q"){ S.q=e.target.value; renderTable(); }
});

/* ============================================================ شروع ============================================================ */
(function init(){
  var u=loadSession();
  if(u && u.token && ALLOWED_ROLES.indexOf(u.role)>=0){ S.user=u; renderShell(); loadReport(); }
  else { clearSession(); renderLogin(""); }
})();
</script>
